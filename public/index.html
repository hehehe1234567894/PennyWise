<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PennyWise 记账</title>
  <meta name="theme-color" content="#0f1115">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="js-error" class="js-error hidden"></div>
  <header class="topbar">
    <div class="logo"><span class="logo-mark">💰</span><h1>PennyWise</h1><span class="ver-chip">v28</span></div>
    <div class="topbar-right">
      <span id="net-chip" class="chip chip-ok hidden">在线</span>
      <button id="btn-settings" class="icon-btn" title="设置">⚙</button>
    </div>
  </header>

  <main id="app-main">
    <div id="model-alert" class="model-alert hidden"></div>
    <div class="dash">

    <!-- 流水 -->
    <section id="tab-list" class="panel" hidden>
      <div class="panel-head">
        <h2 class="panel-title">📄 流水</h2>
        <div class="panel-tools">
          <input id="list-month" type="month">
          <input id="list-q" type="search" placeholder="搜索商户 / 备注">
        </div>
      </div>
      <div id="list-summary" class="sum-row"></div>
      <div id="list-items" class="panel-scroll"></div>
      <p id="list-empty" class="empty hidden">这个月还没有记录</p>
    </section>

    <!-- 统计 -->
    <section id="tab-stats" class="panel" hidden>
      <div class="panel-head">
        <h2 class="panel-title">📊 统计</h2>
        <input id="stats-month" type="month" class="month-input">
      </div>
      <div class="panel-scroll">
        <div id="stats-cards" class="stats-cards"></div>
        <div id="stats-extra"></div>
        <h3>预算（本月）</h3>
        <div class="btn-row">
          <select id="bud-cat"></select>
          <input id="bud-limit" type="number" step="0.01" min="0.01" inputmode="decimal" placeholder="限额（元）">
        </div>
        <div class="btn-row">
          <button id="bud-save" class="btn btn-primary">保存预算</button>
        </div>
        <div id="budget-list"></div>
      </div>
    </section>

    <!-- 以下两个板块已停用（隐藏保留，数据流不受影响） -->
    <section id="tab-capture" class="panel" hidden>
      <h2>记一笔</h2>
      <p class="hint">粘贴交易通知 / 点「选截图」识别支付截图 / 电脑上可直接 Ctrl+V 粘贴截图</p>
      <textarea id="capture-text" rows="5" placeholder="微信支付 收款方：全家便利店 ¥18.50"></textarea>
      <div class="btn-row">
        <button id="btn-paste" class="btn">粘贴</button>
        <button id="btn-image" class="btn">选截图</button>
      </div>
      <div class="btn-row">
        <button id="btn-parse" class="btn btn-primary">解析入账</button>
        <button id="btn-manual" class="btn">手动记账</button>
      </div>
      <input id="file-image" type="file" accept="image/*" hidden>
    </section>

    <section id="tab-pending" class="panel" hidden>
      <div class="section-head"><h2>待处理</h2><span id="pending-count" class="chip"></span></div>
      <div id="pending-list"></div>
      <p id="pending-empty" class="empty hidden">没有待确认的记录 🎉</p>
    </section>
    </div>
  </main>

  <nav class="tabs">
    <button class="tab active" data-tab="list"><span class="tab-ico">📄</span><span>流水</span></button>
    <button class="tab" data-tab="stats"><span class="tab-ico">📊</span><span>统计</span></button>
  </nav>

  <button id="btn-chat" class="chat-fab" title="AI 助手">🤖</button>

  <div id="chat-modal" class="modal hidden">
    <div class="modal-card chat-card">
      <div class="modal-head"><span>🤖 AI 助手</span><button class="icon-btn" data-close-chat>✕</button></div>
      <div id="chat-msgs" class="chat-msgs"></div>
      <div class="chat-input-row">
        <input id="chat-input" type="text" placeholder="问账目 / 求平替推荐…" autocomplete="off">
        <button id="chat-send" class="btn btn-primary">发送</button>
      </div>
    </div>
  </div>

  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head"><span id="modal-title"></span><button class="icon-btn" data-close>✕</button></div>
      <div id="modal-body"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <div id="lock-screen" class="lock">
    <div class="lock-card">
      <div class="lock-logo">🔒</div>
      <h2>PennyWise 已锁定</h2>
      <p class="hint">没有通过验证就无法进入。访问令牌在你电脑的 <code>.env</code> 文件里（<code>AUTH_TOKEN=</code> 后面的内容），粘贴到下面验证一次，之后本机会自动记住。</p>
      <input id="lock-token" type="password" placeholder="访问令牌" autocomplete="off">
      <button id="lock-btn" class="btn btn-primary">验证并进入</button>
      <p id="lock-status" class="hint"></p>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
